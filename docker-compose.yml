services:

  receiver:
    build:
      context: .
      args:
        SERVICE: receiver
    container_name: receiver
    user: "${MILTON_UID:-1000}:${MILTON_GID:-1000}"
    ports:
      - "${MILTON_RECEIVER_SMTP_PORT:-2525}:${MILTON_RECEIVER_SMTP_PORT:-2525}"
    env_file:
      - .env
    environment:
      TZ: ${MILTON_TIMEZONE:-UTC}
    restart: unless-stopped
    volumes:
      - ./mnt/etc/milton:/etc/milton

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    container_name: worker
    user: "${MILTON_UID:-1000}:${MILTON_GID:-1000}"
    env_file:
      - .env
    environment:
      TZ: ${MILTON_TIMEZONE:-UTC}
    restart: unless-stopped
    volumes:
      - ./mnt/etc/milton:/etc/milton

  dispatcher:
    build:
      context: .
      args:
        SERVICE: dispatcher
    container_name: dispatcher
    user: "${MILTON_UID:-1000}:${MILTON_GID:-1000}"
    env_file:
      - .env
    environment:
      TZ: ${MILTON_TIMEZONE:-UTC}
    restart: unless-stopped
    volumes:
      - ./mnt/etc/milton:/etc/milton
